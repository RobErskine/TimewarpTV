[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timewarptv"
version = "1.0.0"
description = "TimewarpTV: a retro TV for a Raspberry Pi - fixed channels, shuffled episodes, and an authentic early-2000s television experience."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TimewarpTV" }]
keywords = ["raspberry-pi", "media-player", "retro-tv", "mpv", "nostalgia", "kids"]

# Core runtime dependency. The hardware-specific dependencies (python-mpv,
# evdev) live in the optional "pi" extra so the pure logic can be developed and
# tested on any machine.
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Everything needed to actually run on the Raspberry Pi against a TV.
pi = [
    "python-mpv>=1.0.5",
    "evdev>=1.6.1",
]
# Run the real player (mpv, in a window) on a Mac/Linux dev machine, without
# evdev (Linux-only) - see scripts/make-dev-library.sh.
desktop = [
    "python-mpv>=1.0.5",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
timewarptv = "timewarptv.__main__:main"

[tool.setuptools.packages.find]
include = ["timewarptv*"]

# Ship the OSD font and the brand artwork with the code. (The Pi's editable
# install reads them from the checkout, but a plain `pip install .` would not.)
[tool.setuptools.package-data]
timewarptv = ["assets/fonts/*", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
